
<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Безплатен калкулатор за разход на гориво и цена на пътуване.">
<title>Калкулатор за гориво | Струва ли си?</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1120;color:#f1f5f9;font-family:Arial,sans-serif}
header{padding:20px 6%;border-bottom:1px solid #29364c}
header a{color:#38bdf8;text-decoration:none;font-weight:bold}
main{max-width:650px;margin:40px auto;padding:0 18px}
h1{text-align:center;font-size:32px}
.subtitle{text-align:center;color:#aebbd0;margin-bottom:30px}
.card{background:#172236;padding:25px;border:1px solid #2b3b53;border-radius:18px}
label{display:block;margin:17px 0 7px;font-weight:bold}
input{width:100%;padding:14px;background:#0b1120;color:white;border:1px solid #475569;border-radius:9px;font-size:17px}
.check{display:flex;align-items:center;gap:10px;margin-top:20px}
.check input{width:auto}
.check label{margin:0}
button{width:100%;margin-top:25px;padding:15px;background:#38bdf8;color:#07121f;border:0;border-radius:10px;font-size:17px;font-weight:bold;cursor:pointer}
.result{margin-top:25px;padding:20px;border-radius:12px;background:#0b1120;text-align:center}
.result strong{display:block;font-size:31px;color:#38bdf8;margin:10px 0}
.result p{color:#cbd5e1}
.error{color:#fca5a5}
footer{text-align:center;padding:30px;color:#aebbd0}
footer a{color:#38bdf8}
</style>
</head>
<body>
<header><a href="index.html">← Струва ли си?</a></header>

<main>
<h1>⛽ Калкулатор за гориво</h1>
<p class="subtitle">Изчисли колко ще ти струва всяко пътуване.</p>

<div class="card">
<label for="km">Разстояние в едната посока (км)</label>
<input id="km" type="number" min="0.1" step="any" placeholder="Например: 250">

<label for="consumption">Среден разход (л/100 км)</label>
<input id="consumption" type="number" min="0.1" step="any" placeholder="Например: 6">

<label for="price">Цена на горивото (€/литър)</label>
<input id="price" type="number" min="0.01" step="any" placeholder="Например: 1.45">

<div class="check">
<input id="returnTrip" type="checkbox">
<label for="returnTrip">Отиване и връщане</label>
</div>

<button onclick="calculate()">Изчисли разхода</button>

<div class="result" id="result" aria-live="polite" hidden></div>
</div>

<p class="subtitle" style="margin-top:25px">
Резултатите са ориентировъчни. Реалният разход зависи от трафика, скоростта и условията.
</p>
</main>

<footer>
<a href="index.html">Начало</a> ·
<a href="sravnenie.html">Сравнение на автомобили</a> ·
<a href="privacy.html">Поверителност</a>
</footer>

<script>
function calculate(){
 const km=Number(document.getElementById("km").value);
 const consumption=Number(document.getElementById("consumption").value);
 const price=Number(document.getElementById("price").value);
 const result=document.getElementById("result");
 result.hidden=false;

 if(!Number.isFinite(km)||!Number.isFinite(consumption)||
 !Number.isFinite(price)||km<=0||consumption<=0||price<=0){
   result.innerHTML='<p class="error">Моля, въведи валидни положителни стойности във всички полета.</p>';
   return;
 }

 const isReturn=document.getElementById("returnTrip").checked;
 const distance=km*(isReturn?2:1);
 const liters=distance*consumption/100;
 const total=liters*price;
 const fmt=n=>n.toLocaleString("bg-BG",{minimumFractionDigits:2,maximumFractionDigits:2});

 result.innerHTML=
 '<p>Общо разстояние: <b>'+fmt(distance)+' км</b></p>'+
 '<p>Необходимо гориво: <b>'+fmt(liters)+' литра</b></p>'+
 '<p>Цена на пътуването:</p>'+
 '<strong>'+fmt(total)+' €</strong>';
}
</script>
</body>
</html>
